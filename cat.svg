<?xml version="1.0" encoding="UTF-8"?>
<!--
  A ginger cat lying on a window's top edge, front paws and tail hanging over it.
  The window's top edge (the "ledge") sits at y = 70 in this viewBox; shell.qml
  aligns that line with the window's outer top edge.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 120" width="200" height="120">
  <g stroke="#2b2230" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">

    <!-- tail: outline pass, then colour pass on top -->
    <path d="M 160 62 C 182 62 186 76 181 92 C 177 104 182 113 190 110"
          fill="none" stroke-width="17"/>
    <path d="M 160 62 C 182 62 186 76 181 92 C 177 104 182 113 190 110"
          fill="none" stroke="#f4a259" stroke-width="8"/>
    <path d="M 180.5 96 L 182 102" fill="none" stroke="#d9782f" stroke-width="5"/>

    <!-- front paws, hanging over the edge (behind the chest) -->
    <path d="M 70 60 L 70 92 Q 70 101 78 101 Q 86 101 86 92 L 86 60 Z" fill="#fff6e9"/>
    <path d="M 92 60 L 92 88 Q 92 97 100 97 Q 108 97 108 88 L 108 60 Z" fill="#fff6e9"/>
    <path d="M 78 95 L 78 101 M 100 91 L 100 97" fill="none" stroke-width="2.5"/>

    <!-- body loaf -->
    <path d="M 66 72 C 56 66 60 46 82 39 C 108 30 148 30 166 43 C 180 53 178 70 166 72 Z"
          fill="#f4a259"/>
    <!-- the ledge-hugging belly line -->
    <path d="M 66 72 L 166 72" fill="none"/>
    <!-- back stripes -->
    <g fill="none" stroke="#d9782f" stroke-width="5">
      <path d="M 118 35 Q 121 42 117 50"/>
      <path d="M 134 34 Q 137 41 133 49"/>
      <path d="M 150 38 Q 153 44 149 51"/>
    </g>

    <!-- ears -->
    <path d="M 39 38 L 37 11 L 58 26 Z" fill="#f4a259"/>
    <path d="M 66 25 L 83 10 L 86 37 Z" fill="#f4a259"/>
    <path d="M 43 32 L 42 19 L 52 27 Z" fill="#f2a7a7" stroke="none"/>
    <path d="M 71 26 L 80 18 L 81 31 Z" fill="#f2a7a7" stroke="none"/>

    <!-- head -->
    <ellipse cx="61" cy="46" rx="27" ry="23" fill="#f4a259"/>
    <!-- forehead stripes -->
    <g fill="none" stroke="#d9782f" stroke-width="4">
      <path d="M 54 27 L 55 34"/>
      <path d="M 61 26 L 61 33"/>
      <path d="M 68 27 L 67 34"/>
    </g>
    <!-- muzzle -->
    <ellipse cx="61" cy="57" rx="13" ry="9" fill="#fff6e9" stroke="none"/>
    <!-- cheeks -->
    <ellipse cx="42" cy="54" rx="5" ry="3" fill="#f2a7a7" stroke="none" opacity="0.8"/>
    <ellipse cx="80" cy="54" rx="5" ry="3" fill="#f2a7a7" stroke="none" opacity="0.8"/>
    <!-- eyes, looking down at the window -->
    <ellipse cx="50" cy="47" rx="3.6" ry="4.4" fill="#2b2230" stroke="none"/>
    <ellipse cx="72" cy="47" rx="3.6" ry="4.4" fill="#2b2230" stroke="none"/>
    <circle cx="51.2" cy="45.4" r="1.3" fill="#ffffff" stroke="none"/>
    <circle cx="73.2" cy="45.4" r="1.3" fill="#ffffff" stroke="none"/>
    <!-- nose and mouth -->
    <path d="M 58 52 L 64 52 L 61 55.5 Z" fill="#e0707a" stroke-width="2"/>
    <path d="M 55 58 Q 58 61.5 61 57.5 Q 64 61.5 67 58" fill="none" stroke-width="2.5"/>
    <!-- whiskers -->
    <g fill="none" stroke-width="2">
      <path d="M 33 50 L 23 48"/>
      <path d="M 33 55 L 23 57"/>
      <path d="M 89 50 L 99 48"/>
      <path d="M 89 55 L 99 57"/>
    </g>
  </g>
</svg>
