<?xml version="1.0" encoding="UTF-8"?>
<!--
  A corgi lying on a window's top edge, short legs hanging over it.
  Same frame as cat.svg: 200x120 viewBox, window top edge (the "ledge") at y = 70.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 120" width="200" height="120">
  <g stroke="#2b2230" stroke-width="6" stroke-linejoin="round" stroke-linecap="round">

    <!-- tail nub -->
    <ellipse cx="181" cy="47" rx="8" ry="6" fill="#e8913a"/>

    <!-- legs hanging over the edge (behind the body): two front, one back -->
    <path d="M 72 62 L 72 86 Q 72 95 80 95 Q 88 95 88 86 L 88 62 Z" fill="#fff6e9"/>
    <path d="M 95 62 L 95 83 Q 95 92 103 92 Q 111 92 111 83 L 111 62 Z" fill="#fff6e9"/>
    <path d="M 156 62 L 156 82 Q 156 90 164 90 Q 172 90 172 82 L 172 62 Z" fill="#fff6e9"/>

    <!-- body loaf: fill, white fluffy rear, then the outline on top -->
    <path d="M 66 72 C 56 66 60 47 82 41 C 110 33 156 33 174 44 C 188 53 186 70 174 72 Z"
          fill="#e8913a" stroke="none"/>
    <path d="M 160 72 C 164 60 174 52 184 56 C 187 62 184 70 176 72 Z" fill="#fff6e9" stroke="none"/>
    <path d="M 66 72 C 56 66 60 47 82 41 C 110 33 156 33 174 44 C 188 53 186 70 174 72 Z"
          fill="none"/>
    <path d="M 66 72 L 174 72" fill="none"/>

    <!-- big ears -->
    <path d="M 37 37 L 30 7 Q 31 3 35 5 L 55 24 Z" fill="#e8913a"/>
    <path d="M 67 24 L 87 5 Q 91 3 92 7 L 85 37 Z" fill="#e8913a"/>
    <path d="M 40 30 L 36 14 L 49 25 Z" fill="#f6c9a0" stroke="none"/>
    <path d="M 73 25 L 86 14 L 82 30 Z" fill="#f6c9a0" stroke="none"/>

    <!-- head -->
    <ellipse cx="61" cy="45" rx="28" ry="23" fill="#e8913a"/>
    <!-- white blaze and muzzle -->
    <path d="M 58 25 Q 61 23 64 25 L 67 46 L 55 46 Z" fill="#fff6e9" stroke="none"/>
    <ellipse cx="61" cy="56" rx="15" ry="10" fill="#fff6e9" stroke="none"/>
    <!-- redraw the head outline over the white patches -->
    <ellipse cx="61" cy="45" rx="28" ry="23" fill="none"/>

    <!-- eyes, looking down at the window -->
    <ellipse cx="48" cy="44" rx="3.6" ry="4.4" fill="#2b2230" stroke="none"/>
    <ellipse cx="74" cy="44" rx="3.6" ry="4.4" fill="#2b2230" stroke="none"/>
    <circle cx="49.2" cy="42.4" r="1.3" fill="#ffffff" stroke="none"/>
    <circle cx="75.2" cy="42.4" r="1.3" fill="#ffffff" stroke="none"/>
    <!-- cheeks -->
    <ellipse cx="41" cy="53" rx="4.5" ry="2.8" fill="#f2a7a7" stroke="none" opacity="0.8"/>
    <ellipse cx="81" cy="53" rx="4.5" ry="2.8" fill="#f2a7a7" stroke="none" opacity="0.8"/>
    <!-- nose, tongue, mouth -->
    <ellipse cx="61" cy="51" rx="4.6" ry="3.4" fill="#2b2230" stroke="none"/>
    <path d="M 58 59.5 Q 61 68 64 59.5 Z" fill="#e8707a" stroke-width="2.5"/>
    <path d="M 55 57.5 Q 58 61 61 57 Q 64 61 67 57.5" fill="none" stroke-width="2.5"/>
  </g>
</svg>
